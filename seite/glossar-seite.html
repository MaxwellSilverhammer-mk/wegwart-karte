<title>Glossar Fürchtegott</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="ktSchrift" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Glossar-Seite: ein Pergament (glossar.js) auf einem dunklen Tisch, eine Spalte, fürs Handy gebaut.
   Vorlage für node glossar.js --seite: Der Platzhalter GLOSSAR_JS im ersten Skript unten wird durch glossar.js ersetzt. */
:root{--tisch:#d9cfb9;--tischText:#3b3028;--tischMuted:#6b5c4c;--akzent:#8e3b22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tisch:#241f1b;--tischText:#e8dfca;--tischMuted:#b9aa90;--akzent:#d98a6a;color-scheme:dark}}
:root[data-theme="dark"]{--tisch:#241f1b;--tischText:#e8dfca;--tischMuted:#b9aa90;--akzent:#d98a6a;color-scheme:dark}
html:root[data-theme="light"] .gl{--pg:#efe2c3}
html:root[data-theme="dark"] .gl{--pg:#d8c9a3}
html,body{height:100%}
body{margin:0;background:var(--tisch);color:var(--tischText);font-family:"EB Garamond",Garamond,Georgia,serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;box-sizing:border-box}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.fuss{font-style:italic;color:var(--tischMuted);font-size:15px;text-align:center;line-height:1.4;margin:0}
.leer{font-style:italic;color:var(--tischMuted);font-size:17px;line-height:1.5;padding:18px 6px;margin:0;text-wrap:balance}
.ti{display:inline-block;width:1em;height:1em;vertical-align:-.15em}
.ti svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glE{scroll-margin-top:12px}
a:focus-visible,button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
</style>

<main>
  <div id="glossar"><p class="leer">Das Glossar wird geholt …</p></div>
  <p class="fuss" id="fuss"></p>
</main>
<script>/*GLOSSAR_JS*/</script>
<script>
(function () {
  'use strict';
  var el = document.getElementById('glossar'), fuss = document.getElementById('fuss');
  // Tabler-Zeichen (MIT) aus dem Sprite oben in jedes <i class="ti ti-…"> setzen, das glossar.js zeichnet
  function ikonen() {
    Array.prototype.forEach.call(el.querySelectorAll('i.ti'), function (i) {
      var n = (i.className.match(/ti-([a-z0-9-]+)/) || [])[1];
      if (n && !i.firstChild && document.getElementById('ti-' + n)) i.innerHTML = '<svg><use href="#ti-' + n + '"></use></svg>';
    });
  }
  function leer(t) { el.className = ''; el.innerHTML = '<p class="leer"></p>'; el.firstChild.textContent = t; fuss.textContent = ''; }
  // Der Eintrag aus #id der Adresse; ist er noch nicht gezeichnet, bleibt er vorgemerkt
  var auf = (location.hash || '').replace(/^#/, '');
  function oeffne() {
    var b = auf && el.querySelector('.glE[data-id="' + String(auf).replace(/"/g, '') + '"] button.glZ');
    if (!b) return;
    if (b.getAttribute('aria-expanded') !== 'true') b.click();
    if (b.scrollIntoView) b.scrollIntoView({ block: 'start' });
    auf = '';
  }
  window.addEventListener('hashchange', function () { auf = (location.hash || '').replace(/^#/, ''); oeffne(); });
  function los() {
    if (!window.claude || typeof window.claude.use !== 'function') { leer('Diese Seite gehört auf claude.ai: Dort holt sie das Glossar aus ihrer Datenbank.'); return; }
    window.claude.use('db').then(function (db) {
      if (!db) { leer('Das Glossar ist nur zu sehen, wenn du angemeldet bist und die Seite dir gehört oder mit dir geteilt ist.'); return; }
      var meta = null, docs = null;
      function zeichnen() {
        if (meta === null || docs === null) return;
        var offen = Array.prototype.map.call(el.querySelectorAll('.glE button.glZ[aria-expanded="true"]'), function (b) { return b.closest('.glE').getAttribute('data-id'); });
        if (!docs.length) { leer('Noch kein Eintrag. Die Spielleitung füllt das Glossar beim Sitzungsende; fett gedruckte Wörter im Spiel landen hier.'); return; }
        var D = window.GLOSSAR_TISCH.ausDokumenten(meta, docs);
        window.GLOSSAR_TISCH.einbauen(el, D);
        ikonen();
        offen.forEach(function (id) { var b = el.querySelector('.glE[data-id="' + id.replace(/"/g, '') + '"] button.glZ'); if (b) b.click(); });
        oeffne();
        fuss.textContent = (meta.stand ? meta.stand : '') + (typeof meta.stufe === 'number' ? ' · Gefahrzeichen nach Stufe ' + meta.stufe : '') + ' · Die Spielleitung trägt beim Sitzungsende nach.';
      }
      function panne(e) { leer('Das Glossar ließ sich nicht holen (' + (e && e.code ? e.code : 'unbekannt') + '). Lad die Seite später noch einmal.'); }
      db.doc('meta/glossar').onSnapshot(function (s) { meta = s.exists ? s.data() : {}; zeichnen(); }, panne);
      db.collection('glossar').orderBy('reihe').limit(1000).onSnapshot(function (q) { docs = q.docs.map(function (d) { return { id: d.id, daten: d.data() }; }); zeichnen(); }, panne);
    });
  }
  los();
})();
</script>
