<title>Fürchtegotts Buch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Spielerbuch: die Tische der Figur (Glossar, Logbuch, Gepäck, Karte) und „Was bisher geschah“ auf einem Tisch, eine Spalte.
   Vorlage für node seite/bauen.js: Die Platzhalter *_JS werden durch die Tische aus dem Repository ersetzt, SPRITE durch die Tabler-Zeichen. */
:root{--tisch:#d9cfb9;--tischText:#3b3028;--tischMuted:#6b5c4c;--akzent:#8e3b22;--pg:#efe2c3;--pgRand:#b79d6e;--leiste:#cbbd9f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tisch:#241f1b;--tischText:#e8dfca;--tischMuted:#b9aa90;--akzent:#d98a6a;--pg:#d8c9a3;--pgRand:#8a7650;--leiste:#2f2823;color-scheme:dark}}
:root[data-theme="dark"]{--tisch:#241f1b;--tischText:#e8dfca;--tischMuted:#b9aa90;--akzent:#d98a6a;--pg:#d8c9a3;--pgRand:#8a7650;--leiste:#2f2823;color-scheme:dark}
html:root[data-theme="light"] .gl{--pg:#efe2c3}
html:root[data-theme="dark"] .gl{--pg:#d8c9a3}
body{margin:0;background:var(--tisch);color:var(--tischText);font-family:"EB Garamond",Garamond,Georgia,serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px;box-sizing:border-box}
main{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-width:0}
nav{position:sticky;top:0;z-index:5;background:var(--tisch);padding:10px 0 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--pgRand)}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:17px;color:var(--tischText);background:transparent;border:1px solid var(--pgRand);border-radius:999px;padding:4px 13px;white-space:nowrap;cursor:pointer;flex:0 0 auto}
nav button[aria-selected="true"]{background:var(--tischText);color:var(--tisch);border-color:var(--tischText)}
h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:14px 0 0}
.kopf{margin:0;color:var(--tischMuted);font-style:italic;font-size:16px}
section[hidden]{display:none!important}
.fuss{font-style:italic;color:var(--tischMuted);font-size:15px;text-align:center;line-height:1.4;margin:0}
.leer{font-style:italic;color:var(--tischMuted);font-size:17px;line-height:1.5;padding:18px 6px;margin:0;text-wrap:balance}
.ti{display:inline-block;width:1em;height:1em;vertical-align:-.15em}
.ti svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glE{scroll-margin-top:64px}
.ge{background:var(--pg);color:#2f2519;border:1px solid var(--pgRand);border-radius:6px;padding:4px 16px 10px;font-size:18px;line-height:1.5}
.ge details{border-bottom:1px solid #c9b48c;padding:8px 0}
.ge details:last-child{border-bottom:0}
.ge summary{cursor:pointer;font-family:"IM Fell English",Georgia,serif;font-size:20px;color:#5a2e16}
.ge ul{margin:6px 0 0;padding-left:20px}
.ge li{margin:4px 0}
.ge blockquote{margin:6px 0 6px 4px;padding-left:12px;border-left:3px solid #c9b48c;font-style:italic}
.hinweis{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--tischText);color:var(--tisch);padding:10px 14px;border-radius:8px;font-size:16px;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#karte-teil button{font:inherit;font-size:16px;color:#2f2519;background:var(--pg);border:1px solid var(--pgRand);border-radius:6px;padding:3px 12px;cursor:pointer}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
</style>
<!--SPRITE-->
<main>
  <h1 id="titel">Fürchtegotts Buch</h1>
  <p class="kopf" id="stand">Das Buch wird aufgeschlagen …</p>
  <nav role="tablist" aria-label="Teile des Buchs">
    <button role="tab" id="t-glossar" aria-controls="glossar-teil" aria-selected="true">Glossar</button>
    <button role="tab" id="t-logbuch" aria-controls="logbuch-teil" aria-selected="false">Logbuch</button>
    <button role="tab" id="t-gepaeck" aria-controls="gepaeck-teil" aria-selected="false">Gepäck</button>
    <button role="tab" id="t-karte" aria-controls="karte-teil" aria-selected="false">Karte</button>
    <button role="tab" id="t-geschichte" aria-controls="geschichte-teil" aria-selected="false">Geschichte</button>
  </nav>
  <section id="glossar-teil" role="tabpanel" aria-labelledby="t-glossar"><div id="glossar"><p class="leer">Das Glossar wird geholt …</p></div></section>
  <section id="logbuch-teil" role="tabpanel" aria-labelledby="t-logbuch" hidden><div id="logbuch"><p class="leer">Das Logbuch wird geholt …</p></div></section>
  <section id="gepaeck-teil" role="tabpanel" aria-labelledby="t-gepaeck" hidden><div id="gepaeck"><p class="leer">Das Gepäck wird geholt …</p></div></section>
  <section id="karte-teil" role="tabpanel" aria-labelledby="t-karte" hidden><div id="karte"><p class="leer">Die Karte wird geholt …</p></div></section>
  <section id="geschichte-teil" role="tabpanel" aria-labelledby="t-geschichte" hidden><div id="geschichte" class="ge"><p class="leer">Die Geschichte wird geholt …</p></div></section>
  <p class="fuss">Nur, was die Figur weiß. Die Spielleitung trägt beim Sitzungsende nach.</p>
</main>
<script type="text/plain" id="js-glossar">/*GLOSSAR_JS*/</script>
<script type="text/plain" id="js-karte">/*KARTE_JS*/</script>
<script type="text/plain" id="js-gepaeck">/*INVENTAR_JS*/</script>
<script type="text/plain" id="js-logbuch">/*QUESTLOG_JS*/</script>
<script>
(function () {
  'use strict';
  var TEILE = ['glossar', 'logbuch', 'gepaeck', 'karte', 'geschichte'];
  var GLOBAL = { karte: 'KARTE', gepaeck: 'INVENTAR', logbuch: 'QUESTLOG' };
  var daten = { meta: null, glossar: null, tische: {}, geschichte: null }, gezeichnet = {}, glossarD = null, offenAuf = '';
  function $(id) { return document.getElementById(id); }

  // Tabler-Zeichen (MIT) aus dem Sprite in jedes <i class="ti ti-…"> setzen, auch in später gezeichneten Teilen
  function ikonen(wurzel) {
    Array.prototype.forEach.call((wurzel || document).querySelectorAll('i.ti'), function (i) {
      var n = (i.className.match(/ti-([a-z0-9-]+)/) || [])[1];
      if (n && !i.querySelector('svg') && $('ti-' + n)) i.innerHTML = '<svg><use href="#ti-' + n + '"></use></svg>';
    });
  }
  if (window.MutationObserver) new MutationObserver(function () { ikonen(); }).observe(document.querySelector('main'), { childList: true, subtree: true });

  function hinweis(text) {
    var h = document.createElement('div'); h.className = 'hinweis'; h.setAttribute('role', 'status'); h.textContent = text;
    document.body.appendChild(h); setTimeout(function () { h.remove(); }, 4200);
  }
  function leer(id, text) { var el = $(id); el.innerHTML = '<p class="leer"></p>'; el.firstChild.textContent = text; }
  function lade(teil) {
    var s = document.createElement('script');
    s.textContent = $('js-' + teil).textContent;
    document.body.appendChild(s);
  }

  // Die Knöpfe der Tische fragen sonst die Spielleitung; hier blättern sie im Buch
  window.sendPrompt = function (text) {
    var m = String(text || '').match(/^Glossar\s+(.+)$/i);
    if (m) { zeige('glossar'); oeffneGlossar(m[1].trim()); return; }
    var t = { karte: 'karte', inventar: 'gepaeck', questlog: 'logbuch', glossar: 'glossar' }[String(text || '').trim().toLowerCase()];
    if (t) { zeige(t); return; }
    hinweis('Das gehört an den Spieltisch: „' + text + '“');
  };

  function zeige(teil) {
    TEILE.forEach(function (t) {
      $(t + '-teil').hidden = t !== teil;
      $('t-' + t).setAttribute('aria-selected', String(t === teil));
    });
    try { history.replaceState(null, '', '#' + teil); } catch (e) {}
    zeichne(teil);
  }
  TEILE.forEach(function (t) { $('t-' + t).addEventListener('click', function () { zeige(t); }); });

  function oeffneGlossar(wer) {
    offenAuf = wer;
    if (!glossarD) return;
    var n = String(wer).toLowerCase(), e = null;
    glossarD.eintraege.forEach(function (x) {
      if (e) return;
      if (x.id === wer || String(x.name).toLowerCase() === n || (x.namen || []).some(function (y) { return String(y).toLowerCase() === n; })) e = x;
    });
    offenAuf = '';
    if (!e) { hinweis('Dazu steht noch nichts im Glossar: „' + wer + '“'); return; }
    var b = document.querySelector('#glossar .glE[data-id="' + String(e.id).replace(/"/g, '') + '"] button.glZ');
    if (!b) return;
    if (b.getAttribute('aria-expanded') !== 'true') b.click();
    if (b.scrollIntoView) b.scrollIntoView({ block: 'start' });
  }

  function zeichne(teil) {
    if (teil === 'glossar') {
      if (!daten.glossar || !daten.meta) return;
      if (!daten.glossar.length) { leer('glossar', 'Noch kein Eintrag. Fett gedruckte Wörter im Spiel landen hier.'); return; }
      if (!window.GLOSSAR_TISCH) lade('glossar');
      var offen = Array.prototype.map.call(document.querySelectorAll('#glossar .glE button.glZ[aria-expanded="true"]'), function (b) { return b.closest('.glE').getAttribute('data-id'); });
      glossarD = window.GLOSSAR_TISCH.ausDokumenten(daten.meta.glossar || {}, daten.glossar);
      window.GLOSSAR_TISCH.einbauen($('glossar'), glossarD);
      offen.forEach(function (id) { var b = document.querySelector('#glossar .glE[data-id="' + id.replace(/"/g, '') + '"] button.glZ'); if (b) b.click(); });
      if (offenAuf) oeffneGlossar(offenAuf);
      return;
    }
    if (teil === 'geschichte') { zeichneGeschichte(); return; }
    var D = daten.tische[teil];
    if (D === undefined) return;
    if (!D) { leer(teil, 'Noch leer. Die Spielleitung trägt beim Sitzungsende nach.'); return; }
    if (gezeichnet[teil] === D) return;
    gezeichnet[teil] = D;
    window[GLOBAL[teil]] = D;
    $(teil).innerHTML = '';
    lade(teil);
  }

  // „Was bisher geschah“: kleiner Markdown-Leser für Absätze, Listen, Zitate, fett und kursiv
  function inline(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }
  function absatz(text) {
    var html = '', tiefe = 0;
    text.split('\n').forEach(function (z) {
      if (!z.trim()) return;
      var q = z.match(/^\s*>\s?(.*)$/);
      if (q) {
        var zitat = '<blockquote>' + inline(q[1]) + '</blockquote>';
        // Ein Zitat unter einem Listenpunkt gehört in diesen Punkt
        if (tiefe > 0 && /<\/li>$/.test(html)) html = html.replace(/<\/li>$/, zitat + '</li>'); else html += zitat;
        return;
      }
      var m = z.match(/^(\s*)[-*]\s+(.*)$/);
      if (m) {
        var t = Math.floor(m[1].length / 2) + 1;
        while (tiefe < t) { html += '<ul>'; tiefe++; }
        while (tiefe > t) { html += '</ul>'; tiefe--; }
        html += '<li>' + inline(m[2]) + '</li>';
        return;
      }
      while (tiefe > 0) { html += '</ul>'; tiefe--; }
      html += '<p>' + inline(z.trim()) + '</p>';
    });
    while (tiefe > 0) { html += '</ul>'; tiefe--; }
    return html;
  }
  function zeichneGeschichte() {
    var g = daten.geschichte;
    if (!g) return;
    if (!g.length) { leer('geschichte', 'Noch nichts erzählt.'); return; }
    var el = $('geschichte'); el.innerHTML = '';
    g.forEach(function (d, i) {
      var det = document.createElement('details'); if (i === g.length - 1) det.open = true;
      var s = document.createElement('summary'); s.textContent = d.titel || d.id;
      var div = document.createElement('div'); div.innerHTML = absatz(String(d.text || ''));
      det.appendChild(s); det.appendChild(div); el.appendChild(det);
    });
  }

  function aktiv() { var t = TEILE.filter(function (x) { return !$(x + '-teil').hidden; })[0]; return t || 'glossar'; }

  function los() {
    var h = (location.hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) {}
    h = { questlog: 'logbuch', inventar: 'gepaeck', gepäck: 'gepaeck', 'was-bisher-geschah': 'geschichte' }[h.toLowerCase()] || h;
    if (TEILE.indexOf(h) >= 0) zeige(h); else if (h) { offenAuf = h; zeige('glossar'); }
    if (!window.claude || typeof window.claude.use !== 'function') { $('stand').textContent = 'Dieses Buch gehört auf claude.ai: Dort holt es seine Seiten aus der Datenbank.'; return; }
    window.claude.use('db').then(function (db) {
      if (!db) { $('stand').textContent = 'Das Buch ist nur zu sehen, wenn du angemeldet bist und es dir gehört oder mit dir geteilt ist.'; return; }
      function panne(e) { $('stand').textContent = 'Eine Seite ließ sich nicht holen (' + (e && e.code ? e.code : 'unbekannt') + '). Lad das Buch später noch einmal.'; }
      daten.meta = {};
      db.collection('meta').onSnapshot(function (q) {
        q.docs.forEach(function (d) { daten.meta[d.id] = d.data(); });
        var b = daten.meta.buch || {}, g = daten.meta.glossar || {};
        if (b.titel) { $('titel').textContent = b.titel; document.title = b.titel; }
        $('stand').textContent = (b.stand || g.stand || '') + (typeof (b.stufe || g.stufe) === 'number' ? ' · Stufe ' + (b.stufe || g.stufe) : '');
        if (aktiv() === 'glossar') zeichne('glossar');
      }, panne);
      db.collection('glossar').orderBy('reihe').limit(1000).onSnapshot(function (q) {
        daten.glossar = q.docs.map(function (d) { return { id: d.id, daten: d.data() }; });
        if (aktiv() === 'glossar') zeichne('glossar');
      }, panne);
      db.collection('tische').onSnapshot(function (q) {
        var neu = { karte: null, gepaeck: null, logbuch: null };
        q.docs.forEach(function (d) { if (d.id in neu) neu[d.id] = d.data(); });
        daten.tische = neu;
        var t = aktiv(); if (t !== 'glossar' && t !== 'geschichte') zeichne(t);
      }, panne);
      db.collection('geschichte').orderBy('reihe').limit(1000).onSnapshot(function (q) {
        daten.geschichte = q.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        if (aktiv() === 'geschichte') zeichneGeschichte();
      }, panne);
    });
  }
  los();
})();
</script>
